name: Scheduled Precompute (Kotak)

permissions:
  contents: write

on:
  schedule:
    - cron: "0 11 * * 1-5"   # 16:30 IST, Mon-Fri, after the 15:30 close
  workflow_dispatch: {}      # run it by hand from the Actions tab

concurrency:
  group: precompute
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy "kotakneoapi>=3.0.7" pyotp websocket-client protobuf httpx

      - name: Run Kotak precompute
        env:
          KOTAK_CONSUMER_KEY: ${{ secrets.KOTAK_CONSUMER_KEY }}
          KOTAK_MOBILE: ${{ secrets.KOTAK_MOBILE }}
          KOTAK_UCC: ${{ secrets.KOTAK_UCC }}
          KOTAK_MPIN: ${{ secrets.KOTAK_MPIN }}
          KOTAK_TOTP_SECRET: ${{ secrets.KOTAK_TOTP_SECRET }}
        run: python github_precompute_kotak.py

      - name: Commit and push updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f sahi_zones_cache.json
          git diff --quiet --cached || git commit -m "Scheduled precompute (Kotak): $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main || true
            git push && break
            sleep 5
          done
